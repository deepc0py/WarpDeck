name: Build and Test

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

env:
  FLUTTER_VERSION: '3.24.0'
  VCPKG_GIT_COMMIT_ID: 'a42af01b72c28a8e1d7b48107b33e4f286a55ef6'

jobs:
  build-and-test:
    name: Build and Test on Ubuntu
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache system dependencies
        uses: actions/cache@v4
        id: apt-cache
        with:
          path: /var/cache/apt
          key: ${{ runner.os }}-apt-deps-v2-${{ hashFiles('**/build.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-deps-v2-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            build-essential \
            pkg-config \
            libssl-dev \
            libavahi-client-dev \
            libgtk-3-dev \
            ninja-build \
            clang \
            libayatana-appindicator3-dev \
            libayatana-ido3-0.4-dev \
            librsvg2-bin \
            imagemagick

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_GIT_COMMIT_ID }}

      - name: Cache vcpkg dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_ROOT }}/installed/
          key: ${{ runner.os }}-vcpkg-deps-v4-${{ hashFiles('**/vcpkg.json', '**/vcpkg-configuration.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-deps-v4-

      - name: Install dependencies with vcpkg
        run: |
          # Only OpenSSL is needed from vcpkg - nlohmann-json is fetched via CMake FetchContent
          $VCPKG_ROOT/vcpkg install openssl

      - name: Cache libwarpdeck build
        uses: actions/cache@v4
        with:
          path: libwarpdeck/build
          key: ${{ runner.os }}-libwarpdeck-build-v2-${{ hashFiles('libwarpdeck/**') }}
          restore-keys: |
            ${{ runner.os }}-libwarpdeck-build-v2-

      - name: Build libwarpdeck
        id: build_lib
        run: |
          cd libwarpdeck
          mkdir -p build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake \
                ..
          make -j$(nproc)
          echo "LIB_PATH=$(pwd)" >> $GITHUB_ENV

      - name: Upload libwarpdeck artifact
        uses: actions/upload-artifact@v4
        with:
          name: libwarpdeck-linux
          path: |
            ${{ env.LIB_PATH }}/libwarpdeck.a
            ${{ env.LIB_PATH }}/libwarpdeck.so

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Build Flutter app
        run: |
          cd warpdeck-flutter/warpdeck_gui
          
          # Ensure the native library is available for the build
          # Check what library files are actually available
          echo "📍 Available library files:"
          ls -la "${{ env.LIB_PATH }}/"
          
          # Create directories for native libraries
          mkdir -p "linux/lib"
          
          # Copy the shared library with fallback names
          if [ -f "${{ env.LIB_PATH }}/libwarpdeck.so" ]; then
            echo "✅ Found libwarpdeck.so"
            cp "${{ env.LIB_PATH }}/libwarpdeck.so" "linux/lib/"
          elif [ -f "${{ env.LIB_PATH }}/libwarpdeck_shared.so" ]; then
            echo "✅ Found libwarpdeck_shared.so, copying as libwarpdeck.so"
            cp "${{ env.LIB_PATH }}/libwarpdeck_shared.so" "linux/lib/libwarpdeck.so"
          else
            echo "❌ No shared library found!"
            exit 1
          fi
          
          # Get dependencies first
          flutter pub get
          
          # Verify header files are available for FFI generation
          echo "🔍 Checking header files for FFI generation..."
          ls -la ../../libwarpdeck/include/
          
          # Run code generation (build_runner needs the library to be available)
          echo "🔧 Running code generation..."
          dart run build_runner build --delete-conflicting-outputs --verbose
          
          # Run analysis
          echo "🔍 Running static analysis..."
          dart analyze --fatal-warnings
          
          # Build the Flutter app
          echo "🏗️ Building Flutter Linux app..."
          flutter build linux --release

